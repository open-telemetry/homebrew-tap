name: OSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '47 4 * * 6' # weekly at 04:47 (UTC) on Saturday
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    permissions:
      contents: read # for actions/checkout
      id-token: write # for Scorecard to publish results
      security-events: write # for the SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/scorecard.yml@f73c28e3be66444181acb54f07ada23f144c0c39 # v0.25.0
