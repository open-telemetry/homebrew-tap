name: Upgrade OCB version

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Collector version to pin (e.g. 0.148.0). Leave empty to auto-detect latest."
        required: false

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for pushing changes

    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor: ignore[artipacked] Credentials are required by the branch push below.
          persist-credentials: true
      - name: Run upgrade script
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: ./tools/upgrade.sh "$VERSION"
      - name: Create otelbot token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
      - name: Commit and open PR
        env:
          # Use otelbot so workflows on the pull request run automatically.
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
        run: |
          if git diff --quiet Formula/ocb.rb; then
            echo "No changes to formula, skipping PR."
            exit 0
          fi

          VERSION=$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/ocb.rb | head -1)
          BRANCH="otelbot/bump/ocb-v${VERSION}"

          git config user.name "otelbot[bot]"
          git config user.email "197425009+otelbot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/ocb.rb
          git commit -m "ocb: bump to v${VERSION}"
          git push -f origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already exists for ${BRANCH}."
            exit 0
          fi

          PR_BODY=$(printf 'Automated version bump for `ocb` (OpenTelemetry Collector Builder).\n\n- **New version:** v%s\n\nUpstream release: https://github.com/open-telemetry/opentelemetry-collector-releases/releases/tag/cmd%%2Fbuilder%%2Fv%s\n' "$VERSION" "$VERSION")
          gh pr create \
            --title "ocb: bump to v${VERSION}" \
            --body "$PR_BODY" \
            --head "$BRANCH" \
            --base main
